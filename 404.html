  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-cat="">
  <header id="site-header"></header>

  <main class="wrap">
    <div class="notfound">
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>주소가 바뀌었거나 삭제된 페이지입니다. 건강상자의 최신 글에서 찾아보세요.</p>
      <a class="btn" href="/">홈으로 가기</a>
    </div>
    <div class="content">
      <section class="main-list" id="cat-list"></section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="/js/posts.js"></script>
  <script src="/js/site.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var el = document.getElementById("cat-list");
      if (!el) return;
      el.innerHTML = (window.POSTS || []).slice(0, 6).map(function (p) {
        return '<a class="listitem" href="' + p.url + '">' + thumbHtml(p, "thumb--list") +
          '<div class="listitem__body"><h3 class="listitem__title">' + esc(p.title) + '</h3>' +
          '<p class="listitem__summary">' + esc(p.summary) + '</p></div></a>';
      }).join("");
    });
  </script>
</body>
