<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"></head><body><div class="page"><div class="wrap"><span class="eyebrow">겨울 건강 · 피부 가려움</span><h1>겨울에 더 <span class="hl">가려운 이유</span></h1><div class="sub">피부 보호막이 얇아지고 수분을 빼앗기면서 작은 자극에도 가려워져요.</div><div class="cards"><div class="card formula"><h3>왜 겨울에 심할까</h3><ul><li>기온이 낮아 <b>피지 분비가 줄어</b> 보호막이 얇아짐</li><li>난방으로 건조한 공기가 <b>각질층 수분</b>을 빼앗음</li><li>긁으면 보호막이 더 벗겨져 <b>악순환</b></li></ul></div><div class="card warn"><h3>오래가면 다른 원인일 수도</h3><p>가려움이 심하거나 오래가면 접촉성·아토피 피부염, 건선 같은 피부 질환이나 <b>빈혈·당뇨·갑상선 질환</b>이 숨어 있을 수 있어요.</p></div></div><div class="foot">출처 : 알고살자 건강정보 · 정보 제공 목적<br>증상이 지속되면 피부과 전문의와 상담하세요.</div></div></div></body></html>
