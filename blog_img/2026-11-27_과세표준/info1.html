<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"></head><body><div class="page"><div class="wrap"><span class="eyebrow">2026년 기준 · 재산세 책정</span><h1>세 가지 축으로 <span class="hl">세금이 갈려요</span></h1><div class="sub">같은 단지라도 옆집과 재산세가 다른 이유예요.</div><div class="cards"><div class="card formula"><h3>재산세 3단계</h3><ul><li>① 공시가격 × 공정시장가액비율 = 과세표준</li><li>② 과세표준 × 세율 − 누진공제 = 본세</li><li>③ 본세 + 지방교육세(본세의 20%)</li></ul></div><div class="card" style="padding:28px 30px"><table><tr><th>공정시장가액비율(2026 주택)</th><th>비율</th></tr><tr class="hlrow"><td>1세대 1주택 (3억↓/3~6억/6억↑)</td><td><b>43 / 44 / 45%</b></td></tr><tr><td>일반(다주택 등)</td><td>60%</td></tr></table></div></div><div class="foot">출처 : 지방세법 · 부동산 공시가격 알리미<br>정확한 세액은 위택스 또는 관할 지자체로 확인하세요.</div></div></div></body></html>
