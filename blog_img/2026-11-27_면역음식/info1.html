<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"></head><body><div class="page"><div class="wrap"><span class="eyebrow">건강음식 · 면역력</span><h1>면역의 상당 부분은 <span class="hl">장(腸)</span></h1><div class="sub">특정 음식 하나보다 다양하게 골고루가 핵심이에요.</div><div class="cards"><div class="card formula"><h3>먼저 핵심만</h3><ul><li>면역세포 상당수가 장에 — <b>발효식품</b>이 중요</li><li>한 가지보다 <b>다양하게 골고루</b></li><li>음식보다 센 건 결국 <b>충분한 잠</b></li></ul></div><div class="card" style="padding:28px 30px"><table><tr><th>음식</th><th>포인트</th></tr><tr class="hlrow"><td>발효식품</td><td>김치·요거트·된장 — 장내 유익균</td></tr><tr><td>마늘·생강</td><td>감기 기운에 챙기던 식재료</td></tr><tr><td>버섯류</td><td>표고·느타리 — 면역 돕는 성분</td></tr><tr><td>제철 과채(비타민C)</td><td>귤·키위·딸기·파프리카</td></tr></table></div></div><div class="foot">출처 : 알고살자 건강음식 · 정보 제공 목적<br>증상이 지속되면 전문의와 상담하세요.</div></div></div></body></html>
