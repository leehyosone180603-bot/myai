<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"></head><body><div class="page"><div class="wrap"><span class="eyebrow">건강정보 · 불면증</span><h1>잠은 <span class="hl">기상 시간</span>에서 시작</h1><div class="sub">'잘 자는 법'보다 일정한 기상 시간이 먼저예요.</div><div class="cards"><div class="card formula"><h3>먼저 핵심만</h3><ul><li>잠은 <b>일정한 기상 시간</b>에서 시작</li><li>저녁의 <b>빛·카페인</b>이 생각보다 큰 범인</li><li>잠이 안 오면 억지로 눕지 말고 잠깐 일어났다 오기</li></ul></div><div class="card"><h3>왜 잠이 안 올까</h3><ul><li>불규칙한 생활 리듬(주말 몰아 늦잠)</li><li>자기 직전 스마트폰 빛</li><li>오후의 커피(카페인은 오래 남아요)</li><li>걱정·스트레스, 긴 낮잠·과식·음주</li></ul></div></div><div class="foot">출처 : 알고살자 건강정보 · 정보 제공 목적<br>불면이 오래가면 수면 전문 진료를 받으세요.</div></div></div></body></html>
