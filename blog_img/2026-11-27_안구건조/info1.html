<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"></head><body><div class="page"><div class="wrap"><span class="eyebrow">겨울 건강 · 안구건조증</span><h1>겨울에 눈이 <span class="hl">더 마르는</span> 이유</h1><div class="sub">메마른 공기와 줄어든 깜빡임이 눈물막을 빠르게 말려요.</div><div class="cards"><div class="card formula"><h3>왜 건조해질까</h3><ul><li>찬 바람·난방으로 <b>눈물막이 빠르게 증발</b></li><li>화면에 집중하면 깜빡임이 <b>분당 15~20회 → 4~5회</b></li><li>콘택트렌즈도 수분을 빼앗는 요인</li></ul></div><div class="card" style="padding:28px 30px"><table><tr><th>방법</th><th>핵심</th></tr><tr class="hlrow"><td>습도·온도</td><td>습도 40~60%, 온도 18~22도</td></tr><tr><td>깜빡임</td><td>20~30분마다 의식적으로</td></tr><tr><td>눈 휴식</td><td>1시간에 10분, 먼 곳 보기</td></tr><tr><td>온찜질</td><td>따뜻한 물수건 5~10분</td></tr></table></div></div><div class="foot">출처 : 알고살자 건강정보 · 정보 제공 목적<br>증상이 지속되면 안과 전문의와 상담하세요.</div></div></div></body></html>
