<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"></head><body><div class="page"><div class="wrap"><span class="eyebrow">건강음식 · 장 건강</span><h1>유산균 한 알보다 <span class="hl">다양하게</span></h1><div class="sub">식이섬유와 발효식품을 골고루 먹는 쪽이 도움이 돼요.</div><div class="cards"><div class="card" style="padding:28px 30px"><table><tr><th>식품</th><th>핵심</th></tr><tr class="hlrow"><td>발효식품(김치·요구르트)</td><td>유익균 공급(프로바이오틱스)</td></tr><tr><td>마늘·양파·대파</td><td>유익균의 먹이(프리바이오틱스)</td></tr><tr><td>통곡물·현미</td><td>식이섬유 풍부</td></tr><tr><td>콩류</td><td>섬유질·단백질</td></tr><tr><td>채소·과일</td><td>식이섬유·수분</td></tr></table></div><div class="card gray"><h3>균 + 먹이 함께</h3><p>프로바이오틱스(균)와 프리바이오틱스(먹이)를 함께 챙기면 더 좋아요. 설탕·색소·식초가 많은 발효 제품은 피하는 편이 나아요.</p></div></div><div class="foot">출처 : 알고살자 건강음식 · 정보 제공 목적<br>증상이 지속되면 전문의와 상담하세요.</div></div></div></body></html>
