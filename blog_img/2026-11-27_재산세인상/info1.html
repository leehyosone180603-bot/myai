<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"></head><body><div class="page"><div class="wrap"><span class="eyebrow">2026년 기준 · 재산세 구조</span><h1>재산세는 <span class="hl">3단계</span>로 정해져요</h1><div class="sub">공시가격만 오른 것 같아도 세액은 더 오를 수 있어요.</div><div class="cards"><div class="card formula"><h3>계산 3단계</h3><ul><li>① 공시가격 × 공정시장가액비율 = 과세표준</li><li>② 과세표준 × 세율 − 누진공제 = 본세</li><li>③ 본세 + 지방교육세(본세의 20%)</li></ul></div><div class="card" style="padding:28px 30px"><table><tr><th>공정시장가액비율(2026 주택)</th><th>비율</th></tr><tr class="hlrow"><td>1세대 1주택 (3억 이하 / 3~6억 / 6억 초과)</td><td><b>43 / 44 / 45%</b></td></tr><tr><td>일반(다주택 등)</td><td>60%</td></tr></table></div></div><div class="foot">출처 : 지방세법 · 2026년 공정시장가액비율<br>정확한 세액은 위택스 또는 관할 지자체로 확인하세요.</div></div></div></body></html>
