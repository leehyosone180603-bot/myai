<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"></head><body><div class="page"><div class="wrap"><span class="eyebrow">건강음식 · 식사 습관</span><h1>음식보다 <span class="hl">먹는 습관</span></h1><div class="sub">종류를 바꾸는 것보다 '순서'를 바꾼 게 제일 효과적이었어요.</div><div class="cards"><div class="card"><h3>혈당을 지키는 습관</h3><ul><li>채소 → 단백질 → 밥 순서</li><li>밥은 천천히 꼭꼭 씹어서</li><li>국물에 밥 말아 후루룩 줄이기</li><li><b>식후 10~15분 가벼운 걷기</b> — 근육이 당을 써요</li><li>단 음료는 물·차로 대체</li></ul></div><div class="card warn"><h3>꼭 기억하세요</h3><p>이미 혈당이 높거나 당뇨 진단을 받았다면 <b>식단과 약은 반드시 주치의와 함께</b> 조절해요. 음식은 '거드는' 역할이에요.</p></div></div><div class="foot">출처 : 알고살자 건강음식<br>혈당이 높으면 전문가와 상담하세요.</div></div></div></body></html>
